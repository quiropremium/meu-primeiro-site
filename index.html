<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiro Premium | Saúde para sua coluna</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* RESET & VARIÁVEIS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    :root {
      --bg-color: #f4f8fa;
      --card-bg: #ffffff;
      --primary-blue: #00aeeef0; /* Cor azul inspirada na marca */
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --hover-color: #0093c4;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px 15px;
    }

    /* CONTAINER PRINCIPAL */
    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* PERFIL / LOGO */
    .profile-header {
      margin-bottom: 24px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: var(--primary-blue);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px auto;
      box-shadow: 0 4px 14px rgba(0, 174, 238, 0.3);
      font-size: 40px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
